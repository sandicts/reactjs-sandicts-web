name: CI PR

on:
  pull_request:
    branches:
      - developer
      - staging
      - master
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  governance:
    name: Governance
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate branch naming and PR target
        run: |
          HEAD="${{ github.head_ref }}"
          BASE="${{ github.base_ref }}"

          echo "Source branch: $HEAD"
          echo "Target branch: $BASE"

          TEMP_BRANCH_REGEX='^(feature|fix|hotfix|docs|refactor|test|ci|chore|rc|codex)/KAN-[0-9]+-[a-z0-9]+(-[a-z0-9]+)*$'

          is_valid_temp_branch=false
          is_valid_protected_branch=false
          is_valid_target=false

          if [[ "$HEAD" =~ $TEMP_BRANCH_REGEX ]]; then
            is_valid_temp_branch=true
          fi

          if [[ "$HEAD" == "developer" || "$HEAD" == "staging" || "$HEAD" == "master" ]]; then
            is_valid_protected_branch=true
          fi

          if [[ "$BASE" == "developer" || "$BASE" == "staging" || "$BASE" == "master" ]]; then
            is_valid_target=true
          fi

          if [[ "$is_valid_target" == "false" ]]; then
            echo "Invalid target branch: $BASE"
            echo "Allowed targets: developer, staging, master"
            exit 1
          fi

          if [[ "$is_valid_temp_branch" == "false" && "$is_valid_protected_branch" == "false" ]]; then
            echo "Invalid source branch name: $HEAD"
            echo "Allowed examples:"
            echo "  feature/KAN-123-create-login-flow"
            echo "  fix/KAN-456-correct-timeout"
            echo "  hotfix/KAN-789-fix-production-crash"
            echo "  docs/KAN-234-update-docs"
            echo "  refactor/KAN-345-reorganize-auth-module"
            echo "  test/KAN-567-add-auth-coverage"
            echo "  ci/KAN-678-update-pr-checks"
            echo "  chore/KAN-321-update-ci"
            echo "  rc/KAN-654-release-candidate"
            echo "  codex/KAN-111-frontend-pr-validation"
            echo "  developer"
            echo "  staging"
            echo "  master"
            exit 1
          fi

  quality:
    name: Quality
    runs-on: ubuntu-latest
    needs: governance
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify runtime
        run: |
          node --version
          npm --version
          node -e "const major = Number(process.versions.node.split('.')[0]); if (major !== 24) { throw new Error(`Expected Node.js 24, received ${process.version}`); }"
          npm_major="$(npm --version | cut -d. -f1)"
          if [ "$npm_major" != "11" ]; then
            echo "Expected npm 11.x, received $(npm --version)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: governance
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify runtime
        run: |
          node --version
          npm --version
          node -e "const major = Number(process.versions.node.split('.')[0]); if (major !== 24) { throw new Error(`Expected Node.js 24, received ${process.version}`); }"
          npm_major="$(npm --version | cut -d. -f1)"
          if [ "$npm_major" != "11" ]; then
            echo "Expected npm 11.x, received $(npm --version)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run tests when configured
        run: |
          if node -e "const pkg = require('./package.json'); process.exit(pkg.scripts && pkg.scripts.test ? 0 : 1)"; then
            npm test
          else
            echo "No test script configured yet."
            echo "Playwright and Vitest remain pending future frontend test tooling."
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: governance
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify runtime
        run: |
          node --version
          npm --version
          node -e "const major = Number(process.versions.node.split('.')[0]); if (major !== 24) { throw new Error(`Expected Node.js 24, received ${process.version}`); }"
          npm_major="$(npm --version | cut -d. -f1)"
          if [ "$npm_major" != "11" ]; then
            echo "Expected npm 11.x, received $(npm --version)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    needs: governance
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify runtime
        run: |
          node --version
          npm --version
          node -e "const major = Number(process.versions.node.split('.')[0]); if (major !== 24) { throw new Error(`Expected Node.js 24, received ${process.version}`); }"
          npm_major="$(npm --version | cut -d. -f1)"
          if [ "$npm_major" != "11" ]; then
            echo "Expected npm 11.x, received $(npm --version)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate
